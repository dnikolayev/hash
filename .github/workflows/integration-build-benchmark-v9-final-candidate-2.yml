# Fork-only ELF inspection, excluded from performance samples.
# Replaces the full workflow on this cache's owning branch.
name: Graph ELF inspection (v9 sample 2)
run-name: ${{ github.ref_name }} / attempt ${{ github.run_attempt }}

on:
  push:
    branches:
      - speedup/integration-build-benchmark-v9-final-candidate-2

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect cached graph ELF
    if: github.repository == 'dnikolayev/hash'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout producer source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 2d8904b0bdfe7e65578294b921e0b6ef1bf2aaae
          persist-credentials: false

      - name: Checkout inspector
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: .elf-diagnostic-source
          persist-credentials: false
          sparse-checkout: .github/benchmarks/graph-build-reuse/inspect_graph_elf.py
          sparse-checkout-cone-mode: false

      - name: Restore producer payload
        id: graph-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/graph-build-cache
          key: graph-build-benchmark-v9final-2-graph-build-v1-8c1978d9ce5b6e302db690fa67209bd6b4f695433a56970929112069f021334b
          fail-on-cache-miss: true

      - name: Inspect verified ELF
        env:
          GRAPH_ELF_SAMPLE: "2"
          DIAGNOSTIC_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GRAPH_CACHE_HIT: ${{ steps.graph-cache.outputs.cache-hit }}
          GRAPH_CACHE_PRIMARY_KEY: ${{ steps.graph-cache.outputs.cache-primary-key }}
          GRAPH_CACHE_MATCHED_KEY: ${{ steps.graph-cache.outputs.cache-matched-key }}
        run: |
          echo 'a23e2f1dee33431f23d6ae3337afe309c3a703feec9d19833012ddb8756bf12e  .elf-diagnostic-source/.github/benchmarks/graph-build-reuse/inspect_graph_elf.py' | sha256sum --check --strict
          python3 .elf-diagnostic-source/.github/benchmarks/graph-build-reuse/inspect_graph_elf.py

      - name: Upload ELF description
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graph-elf-v9-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: elf-report/elf.json
          if-no-files-found: error
          retention-days: 7
